; Sonde de maillage Thread, firmware 1.1.1 (spec :
; docs/superpowers/specs/2026-10-13-maillage-iot-design.md ; 1.0.2 :
; FED, commande routeurs, acces reseau comme le pont Halo de benq ; 1.0.3 :
; LED de la carte, retour allume apres oubli, refus de la cadence comptes ;
; 1.1.0 : ecoute des messages MLE, commandes annonces et resoudre ; 1.1.1 :
; voyant du tronc commun, src/voyant.h).
; ESP32-C6 SuperMini, noeud Matter sur Thread en FED non eligible routeur
; (appaire a Maison par Bluetooth), requetes de diagnostic Thread (DIAG_GET)
; par CoAP, table des routeurs d'OpenThread, lignes JSON sur l'USB, et par le
; reseau Thread (UDP 5480, enveloppe H1, cle creee par l'USB). Chaine calee
; sur benq : pioarduino 55.03.312-1 (Arduino-ESP32 3.3.12, ESP-IDF 5.5.5,
; Matter 1.5).
;
; Premier flash, avec effacement, sur le port designe par Djoko seulement :
;   pio run -t erase --upload-port <port>
;   pio run -t upload --upload-port <port>

[platformio]
default_envs = sonde

[env:sonde]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
; Pas de definition PlatformIO pour la SuperMini : la DevKitC-1 (meme puce),
; flash de 4 Mo au lieu de 8.
board = esp32-c6-devkitc-1
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.flash_size = 4MB
; La pile Matter pese ~2,4 Mo sur le C6 : pas de partition OTA.
board_build.partitions = huge_app.csv
monitor_speed = 115200
; sonde/test : tests hote (sonde/test/lancer.sh), pas des tests pio.
test_ignore = *
build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; USB Serial/JTAG materiel pour Serial.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; FED non eligible routeur (src/main.cpp, repris de l'essai FED) : trois
    ; enveloppes. La creation de la pile OpenThread impose le FED ; le reglage
    ; du type Thread par esp_matter::start (routeur) devient FullEndDevice ;
    ; otThreadSetRouterEligible passe toujours false. Une enveloppe sans son
    ; drapeau, ou l'inverse, ne lie pas.
    -Wl,--wrap=esp_openthread_init
    -Wl,--wrap=_ZN4chip11DeviceLayer8Internal40GenericThreadStackManagerImpl_OpenThreadINS0_22ThreadStackManagerImplEE20_SetThreadDeviceTypeENS0_19ConnectivityManager16ThreadDeviceTypeE
    -Wl,--wrap=otThreadSetRouterEligible
