# Maillage IoT, projet XcodeGen : ce fichier fait foi (le .xcodeproj est genere, jamais commite).
name: MaillageIoT
options:
  bundleIdPrefix: fr.djoko.maillage.iot
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: fr
  createIntermediateGroups: true
  generateEmptyDirectories: false
configFiles:
  Debug: Signature.xcconfig
  Release: Signature.xcconfig
# Sparkle 2 : les mises a jour de l'app, a une version figee (gestionnaire de paquets Swift).
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Textes : catalogues .xcstrings (francais, langue de developpement, et
    # anglais), cles extraites par le compilateur.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: NO
targets:
  MaillageCoeur:
    type: framework
    platform: macOS
    sources:
      - path: MaillageCoeur
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.djoko.maillage.iot.coeur
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
      configs:
        # Le coeur est optimise aussi en Debug : non optimisee, la disposition des pieces prend
        # quelques secondes (80 a 100 fois plus). Il n'a ni assert ni code propre au Debug.
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
  # Le protocole Thread : decodage des annonces, instantanes, maillage de la sonde, journal Thread. Depend du coeur,
  # jamais l'inverse ; optimise aussi en Debug, comme le coeur.
  ProtocoleThread:
    type: framework
    platform: macOS
    sources:
      - path: ProtocoleThread
    dependencies:
      - target: MaillageCoeur
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.djoko.maillage.iot.thread
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
  # Le protocole Zigbee : pont Hue, sonde Zigbee, tournee du maillage, journal Zigbee. Depend du coeur seul (jamais de
  # ProtocoleThread) ; aucun nom public de premier niveau commun avec ProtocoleThread (outils/verifier-noms-publics.sh).
  # Optimise aussi en Debug, comme le coeur.
  ProtocoleZigbee:
    type: framework
    platform: macOS
    sources:
      - path: ProtocoleZigbee
    dependencies:
      - target: MaillageCoeur
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.djoko.maillage.iot.zigbee
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
  MaillageIoT:
    type: application
    platform: macOS
    sources:
      - path: MaillageIoT
    dependencies:
      - target: MaillageCoeur
      - target: ProtocoleThread
      - target: ProtocoleZigbee
      - package: Sparkle
    info:
      path: MaillageIoT/Info.plist
      properties:
        CFBundleDisplayName: Maillage IoT
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Mises a jour (Sparkle 2) : le flux des versions publiees et la cle publique Ed25519 (reglages ci-dessous) ;
        # recherche au demarrage puis toutes les 24 h, telechargement et installation automatiques ; installation
        # par le service de Sparkle, l'app restant dans le bac a sable.
        SUFeedURL: $(FLUX_MISES_A_JOUR)
        SUPublicEDKey: $(CLE_MISES_A_JOUR)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: true
        SUEnableInstallerLauncherService: true
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        NSHumanReadableCopyright: ""
        NSAppleEventsUsageDescription: "Maillage IoT a besoin de contrôler Maillage Thread ou Maillage Zigbee pour les quitter avant de reprendre leurs données."
        NSLocalNetworkUsageDescription: "Maillage IoT écoute les annonces du réseau local (routeurs de bordure Thread, appareils Matter et HomeKit, pont Hue) pour dessiner vos réseaux Thread et Zigbee, et se connecte à vos sondes par le réseau local si vous le choisissez."
        NSBonjourServices:
          - _meshcop._udp
          - _matter._tcp
          - _hap._udp
          - _trel._udp
          - _hue._tcp
          - _maillage-zigbee._tcp
    settings:
      base:
        PRODUCT_NAME: Maillage IoT
        PRODUCT_MODULE_NAME: MaillageIoT
        PRODUCT_BUNDLE_IDENTIFIER: fr.djoko.maillage.iot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # La version publiee (outils/publier.sh) ; le numero de compilation, que compare Sparkle, est donne a la
        # publication : le nombre de commits de main.
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # Le flux des mises a jour (appcast.xml du depot, que publier.sh tient a jour, a son adresse brute) et la cle
        # publique ; la repetition les remplace en ligne de commande.
        FLUX_MISES_A_JOUR: https://raw.githubusercontent.com/Djoko-cli/maillage-iot/main/appcast.xml
        CLE_MISES_A_JOUR: nRIVHOXbEktqGduJ4ukxhjZzlUaiE/yqR3sgbW9Ie6E=
        CODE_SIGN_ENTITLEMENTS: MaillageIoT/Droits.entitlements
        ENABLE_HARDENED_RUNTIME: YES
  # L'identite de repetition (phase 4, tache 8) : « Maillage IoT Repetition », la meme app sous une autre identite, pour repeter
  # la reprise des anciennes apps sur une copie des vraies donnees SANS toucher a l'app reelle. Memes sources que MaillageIoT ;
  # en propre : l'identifiant (donc le conteneur du bac a sable, les preferences, les notifications et l'ouverture de session),
  # le suffixe `.repetition` des services de trousseau ecrits (MaillageSuffixeServices, lu par IdentiteApp), l'icone, les droits
  # et l'Info.plist. Sans Sparkle : aucun cadre lie, aucune cle SU* (la condition de compilation REPETITION donne une classe
  # MisesAJour inerte). JAMAIS publiee : outils/refuser_repetition.py, que la publication appelle. Construite et lancee par
  # outils/repetition.sh (schema MaillageIoTRepetition).
  MaillageIoTRepetition:
    type: application
    platform: macOS
    sources:
      - path: MaillageIoT
        excludes:
          # Ce que la repetition a en propre (MaillageIoTRepetition/) : son Info.plist, ses droits, son icone.
          - Info.plist
          - Droits.entitlements
          - "Ressources/AppIcon.icon"
      - path: MaillageIoTRepetition
    dependencies:
      - target: MaillageCoeur
      - target: ProtocoleThread
      - target: ProtocoleZigbee
    info:
      path: MaillageIoTRepetition/Info.plist
      properties:
        CFBundleDisplayName: Maillage IoT Répétition
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        NSHumanReadableCopyright: ""
        # Le suffixe des services de trousseau ecrits par l'app (IdentiteApp) : ce qui separe ses elements de ceux de l'app reelle.
        MaillageSuffixeServices: .repetition
        NSAppleEventsUsageDescription: "Maillage IoT Répétition a besoin de contrôler Maillage Thread ou Maillage Zigbee pour les quitter avant de reprendre leurs données."
        NSLocalNetworkUsageDescription: "Maillage IoT Répétition écoute les annonces du réseau local (routeurs de bordure Thread, appareils Matter et HomeKit, pont Hue) pour dessiner vos réseaux Thread et Zigbee, et se connecte à vos sondes par le réseau local si vous le choisissez."
        NSBonjourServices:
          - _meshcop._udp
          - _matter._tcp
          - _hap._udp
          - _trel._udp
          - _hue._tcp
          - _maillage-zigbee._tcp
    settings:
      base:
        PRODUCT_NAME: Maillage IoT Repetition
        PRODUCT_MODULE_NAME: MaillageIoTRepetition
        PRODUCT_BUNDLE_IDENTIFIER: fr.djoko.maillage.iot.repetition
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconRepetition
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) REPETITION"
        CODE_SIGN_ENTITLEMENTS: MaillageIoTRepetition/Droits.entitlements
        ENABLE_HARDENED_RUNTIME: YES
  # Passeur Noms, demon de Maison (spec 2026-10-12-demon-passeur-design.md) : app Mac Catalyst sans fenetre ni Dock
  # (LSUIElement), signee en developpement par outils/passeur.sh (HomeKit est refuse au Developer ID). Masqueur.bundle
  # rend invisible, des sa creation, la fenetre de la scene que macOS impose.
  Masqueur:
    type: bundle
    platform: macOS
    sources:
      - path: Masqueur
    info:
      path: Masqueur/Info.plist
      properties:
        NSPrincipalClass: Masqueur
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.djoko.maillage.passeur.masqueur
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
  Passeur:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Passeur
      - path: MaillageCoeur/Noms/NomsMaison.swift
      - path: MaillageCoeur/Noms/ProtocolePasseur.swift
      - path: MaillageCoeur/Annonces/CodageJSON.swift
    dependencies:
      - target: Masqueur
        embed: true
        platformFilter: macOS
        copy:
          destination: plugins
    info:
      path: Passeur/Info.plist
      properties:
        CFBundleDisplayName: Passeur Noms
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Schema d'URL par lequel les apps lui donnent le port et le jeton (EnvoiPasseur.schema).
        CFBundleURLTypes:
          - CFBundleURLName: fr.djoko.maillage.passeur
            CFBundleURLSchemes:
              - maillage-passeur
              # Second schema : seul le nouveau demon le declare, les apps le trouvent par lui (EnvoiPasseur.schemaProtocole).
              - maillage-passeur-1
        # Ni Dock ni menu : un demon.
        LSUIElement: true
        # Version du protocole parle (abonnement) : outils/passeur.sh reconnait ainsi le demon (les apps, par le schema).
        MaillagePasseurProtocole: 1
        NSHomeKitUsageDescription: "Passeur Noms lit les noms, pièces, zones, fabricants et batteries de vos accessoires Maison pour Maillage Thread et Maillage Zigbee, et fait clignoter un accessoire quand vous le demandez (Identifier). Rien ne sort de ce Mac."
        UILaunchScreen: {}
        # macOS 27 impose une scene : declaree sans contenu, gardee connectee et invisible (SceneDelegate).
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Defaut
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).SceneDelegate"
    settings:
      base:
        PRODUCT_NAME: Passeur Noms
        PRODUCT_MODULE_NAME: Passeur
        PRODUCT_BUNDLE_IDENTIFIER: fr.djoko.maillage.passeur
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: Passeur/Passeur.entitlements
        # HomeKit exige un profil : signature automatique ; l'equipe est donnee par outils/passeur.sh
        # (DEVELOPMENT_TEAM en ligne de commande).
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "1,2"
  MaillageCoeurTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MaillageCoeurTests
    dependencies:
      - target: MaillageCoeur
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.djoko.maillage.iot.coeur.tests
        GENERATE_INFOPLIST_FILE: YES
  # Les tests Thread compilent aussi deux fixtures neutres du coeur (sans test), pour les equivalences
  # entre graphe bati a la main et graphe Thread, et l'assistant `idt` (identifiant de noeud d'apres sa cle), que
  # toutes les cibles de test partagent.
  ProtocoleThreadTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ProtocoleThreadTests
      - path: MaillageCoeurTests/MaisonInventee.swift
      - path: MaillageCoeurTests/FixturesScene.swift
      - path: MaillageCoeurTests/AssistantIdNoeud.swift
    dependencies:
      - target: ProtocoleThread
      - target: MaillageCoeur
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.djoko.maillage.iot.thread.tests
        GENERATE_INFOPLIST_FILE: YES
  # Les tests Zigbee compilent aussi les deux fixtures neutres du coeur (sans test), comme ceux de Thread.
  ProtocoleZigbeeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ProtocoleZigbeeTests
      - path: MaillageCoeurTests/MaisonInventee.swift
      - path: MaillageCoeurTests/FixturesScene.swift
      - path: MaillageCoeurTests/AssistantIdNoeud.swift
    dependencies:
      - target: ProtocoleZigbee
      - target: MaillageCoeur
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.djoko.maillage.iot.zigbee.tests
        GENERATE_INFOPLIST_FILE: YES
  # Les tests de l'app (Thread, Zigbee et ce qu'ils partagent ; ceux de Zigbee sous MaillageIoTTests/Zigbee) compilent
  # aussi les vecteurs H1 du coeur (MaillageCoeurTests/VecteursH1.swift, sans test).
  MaillageIoTTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MaillageIoTTests
        excludes:
          - "Ressources/exports/**"
      # Les exports d'exemple de la reprise (phase 4) : un dossier copie tel quel dans le paquet de test, sous son arbre
      # (thread-1.3.0, zigbee-1.1.1), jamais aplati en ressources.
      - path: MaillageIoTTests/Ressources/exports
        type: folder
      - path: MaillageCoeurTests/VecteursH1.swift
      - path: MaillageCoeurTests/AssistantIdNoeud.swift
      # Le generateur de ces exports (outils/generer-exports-exemple.sh le compile avec le contrat) : les tests le relancent
      # et comparent son resultat aux dossiers commites.
      - path: outils/exports-exemple/Generateur.swift
    dependencies:
      - target: MaillageIoT
      - target: MaillageCoeur
      - target: ProtocoleThread
      - target: ProtocoleZigbee
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.djoko.maillage.iot.tests
        GENERATE_INFOPLIST_FILE: YES
        # Le produit s'appelle "Maillage IoT" (avec une espace), pas comme la cible.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Maillage IoT.app/Contents/MacOS/Maillage IoT"
        BUNDLE_LOADER: "$(TEST_HOST)"
      configs:
        # Les mesures de la vue (outils/mesurer.sh vue) compilent ces tests en Release : en module entier, deux classes de
        # preferences (PreferencesMemoire, PreferencesMemoireZigbee) n'y compilent pas (Sendable de UserDefaults).
        Release:
          SWIFT_COMPILATION_MODE: incremental
  # Le coeur du demon Passeur Noms (Passeur/Logique), sans HomeKit ni UIKit, teste sur macOS. Il compile les fichiers
  # communs lui-meme, comme la cible Passeur : pas de dependance a MaillageCoeur (les types seraient en double).
  PasseurTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PasseurTests
      - path: Passeur/Logique
      - path: MaillageCoeur/Noms/NomsMaison.swift
      - path: MaillageCoeur/Noms/ProtocolePasseur.swift
      - path: MaillageCoeur/Annonces/CodageJSON.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.djoko.maillage.passeur.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MaillageIoT:
    build:
      targets:
        MaillageIoT: all
        MaillageCoeur: all
        ProtocoleThread: all
        ProtocoleZigbee: all
        MaillageCoeurTests: [test]
        ProtocoleThreadTests: [test]
        ProtocoleZigbeeTests: [test]
        MaillageIoTTests: [test]
        PasseurTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MaillageCoeurTests
        - ProtocoleThreadTests
        - ProtocoleZigbeeTests
        - MaillageIoTTests
        - PasseurTests
    archive:
      config: Release
  Passeur:
    build:
      targets:
        Passeur: all
    run:
      config: Debug
  # L'identite de repetition (outils/repetition.sh) : l'app seule et ses cadres, sans les tests.
  MaillageIoTRepetition:
    build:
      targets:
        MaillageIoTRepetition: all
        MaillageCoeur: all
        ProtocoleThread: all
        ProtocoleZigbee: all
    run:
      config: Debug
  # Le coeur seul : les temps de calcul de la vue par pieces, en Release (outils/mesurer.sh).
  MaillageCoeur:
    build:
      targets:
        MaillageCoeur: all
        MaillageCoeurTests: [test]
    test:
      config: Release
      targets:
        - MaillageCoeurTests
